name: Deploy Quote Desk to PythonAnywhere

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Deploy and verify public website
        env:
          QUOTE_HOST_USERNAME: ${{ vars.QUOTE_HOST_USERNAME }}
          QUOTE_HOST_API_KEY: ${{ secrets.QUOTE_HOST_API_KEY }}
          QUOTE_HOST_API_ORIGIN: ${{ vars.QUOTE_HOST_API_ORIGIN || 'https://www.pythonanywhere.com' }}
        run: |
          set -euo pipefail
          if [[ -z "$QUOTE_HOST_USERNAME" || -z "$QUOTE_HOST_API_KEY" ]]; then
            echo "Add the QUOTE_HOST_USERNAME repository variable and QUOTE_HOST_API_KEY repository secret first."
            exit 1
          fi
          python deploy/pythonanywhere_api.py --deploy
